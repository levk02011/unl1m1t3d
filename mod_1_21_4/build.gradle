plugins {
	id 'fabric-loom' version '1.7.+'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	mavenLocal()
	// Fabric official repository
	maven {
		name = 'Fabric'
		url = 'https://maven.fabricmc.net/'
	}
	// Додаємо репозиторій, де зберігаються збірки Baritone
	maven { 
		name = 'ImpactDevelopment'
		url = 'https://impactdevelopment.github.io/maven/' 
	}
	// Стандартний Maven Central про всяк випадок
	mavenCentral()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// JSON support (Gson)
	implementation "com.google.code.gson:gson:2.10.1"

	// Інтеграція Baritone API під Minecraft 1.21.4.
	// Використовуємо modImplementation + include, щоб API було доступне під час розробки та пакувалося в мод.
	// Using proper semantic versioning for Baritone API
	modImplementation "cabaletta:baritone-api:1.10.0"
	include "cabaletta:baritone-api:1.10.0"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here.
	}
}